[project]
name = "dlo-bench"
version = "0.1.0"
description = "Dumb Luck Optimization: a paper-traded, post-cutoff LLM trading benchmark"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "polars>=1.0",
  "pandas>=2.2",
  "pyarrow>=16",
  "duckdb>=1.0",
  "exchange_calendars>=4.5",
  "numpy>=1.26",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "arch>=7.0",
  "scikit-learn>=1.5",
  "tenacity>=8.3",
  "typer>=0.12",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
dlo = "dlo.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dlo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: hits real external APIs (skipped unless DLO_LIVE=1)"]
